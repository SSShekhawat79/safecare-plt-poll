[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/vote"
  to = "/vote.html"
  status = 200

[[redirects]]
  from = "/present"
  to = "/present.html"
  status = 200

[[redirects]]
  from = "/report"
  to = "/report.html"
  status = 200
