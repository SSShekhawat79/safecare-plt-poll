<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote · PLT Live Poll</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="voter">
  <header><div class="t" id="title">Loading…</div><div class="n" id="qn"></div></header>
  <div id="closed" class="closed-banner hidden">Voting is closed for this question. Wait for the next one.</div>
  <section class="vcard">
    <h2 id="qtext">Connecting…</h2>
    <div id="answers"></div>
    <div id="msg" class="note"></div>
  </section>
  <p class="privacy">Your answers are anonymous: no names or logins are collected. Please don't type anything that could identify a patient or colleague.</p>
</main>
<script src="/vote.js"></script>
</body>
</html>
